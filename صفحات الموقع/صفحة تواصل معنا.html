<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تواصل معنا - صحيفة التسعين</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    header {
      background-color: #0b3d0b;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    header img {
      width: 200px;
      height: auto;
    }

    header h1 {
      font-size: 40px;
      margin: 0;
    }

    header p {
      font-size: 18px;
      margin-top: 10px;
    }

    nav {
      background-color: #222;
      color: white;
      display: flex;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #0b3d0b; /* اللون الأخضر عند التأشير */
    }

    .contact-section {
      padding: 30px 20px;
      background-color: white;
      text-align: center;
      max-width: 700px;
      margin: 40px auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .contact-section h2 {
      color: #0b3d0b;
      margin-bottom: 20px;
    }

    .contact-section form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .contact-section input,
    .contact-section textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
    }

    .contact-section input:focus,
    .contact-section textarea:focus {
      border-color: #0b3d0b;
      outline: none;
    }

    .contact-section textarea {
      resize: vertical;
      min-height: 120px;
    }

    .contact-section button {
      background-color: #0b3d0b;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .contact-section button:hover {
      background-color: #095a09;
    }

    footer {
      background-color: #0b3d0b;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

  </style>
</head>
<body>

  <!-- رأس الصفحة -->
  <header>
    <img src="شعار صحيفة التسعين.png" alt="شعار الصحيفة">
    <div>
        <p>حيث ينبض قلب الرياضة</p>
    </div>
  </header>

  <!-- شريط التنقل -->
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="sports.html">أخبار الرياضة</a>
    <a href="tech.html">أخبار التقنية</a>
    <a href="local.html">أخبار محلية</a>
    <a href="صفحة تواصل معنا.html">تواصل معنا</a>
  </nav>

  <!-- قسم التواصل -->
  <section class="contact-section">
    <h2>تواصل معنا</h2>
    <form>
      <input type="text" placeholder="الاسم الكامل" required>
      <input type="email" placeholder="البريد الإلكتروني" required>
      <textarea placeholder="اكتب رسالتك هنا..." required></textarea>
      <button type="submit">إرسال</button>
    </form>
  </section>

  <!-- الفوتر -->
  <footer>
    <p>&copy; 2025 صحيفة التسعين - جميع الحقوق محفوظة</p>
    <p>تواصل معنا: info@90news.com</p>
  </footer>

</body>
</html>
